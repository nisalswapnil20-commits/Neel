<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="local.css">
<style>
html,body{margin:0;background:transparent;overflow:hidden}
body{width:2160px;font-family:'Mukta',sans-serif;color:#fff}
#cap{position:absolute;left:0;top:0;width:2160px;height:700px;display:flex;align-items:center;justify-content:center}
#cap .box{max-width:1760px;padding:26px 56px 34px;border-radius:36px;background:rgba(8,8,12,.52);
  box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center;line-height:1.32;font-weight:800;font-size:92px;
  text-shadow:0 4px 14px rgba(0,0,0,.65)}
#cap .w{display:inline-block;margin:0 .14em}
#cap .w.h{visibility:hidden}
#cap .w.cur{color:#FFD447}
.stage{position:absolute;left:0;top:0;width:2160px;height:3840px}
.chip{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.rz{font-family:'Rozha One',serif}
.teko{font-family:'Teko',sans-serif}
.shadow{text-shadow:0 8px 30px rgba(0,0,0,.7)}
</style></head><body>
<div id="cap"></div>
<div id="title" class="stage"></div>
<script>
function setCap(words,n){ // show first n words, highlight n-1
  const c=document.getElementById('cap'); document.getElementById('title').innerHTML='';
  if(!words.length){c.innerHTML='';return}
  c.innerHTML='<div class="box">'+words.map((w,i)=>`<span class="w ${i>=n?'h':''} ${i==n-1?'cur':''}">${w}</span>`).join('')+'</div>';
}
const T={
 hook:`<div class="chip" style="top:430px;animation:cfade .7s ease-out both">
   <div style="font-weight:800;font-size:66px;letter-spacing:.06em;padding:16px 44px;border:4px solid rgba(255,212,71,.9);border-radius:60px;background:rgba(0,0,0,.35)" class="shadow">एक सच्ची कहानी</div></div>`,
 clock:`<div class="chip" style="top:560px;text-align:center;animation:cpop .45s cubic-bezier(.2,1.6,.4,1) both">
   <div class="teko shadow" style="font-size:330px;line-height:.9;color:#fff">03<span style="animation:blink 1s steps(2) infinite">:</span>00</div>
   <div class="shadow" style="font-weight:800;font-size:84px;color:#FFD447;margin-top:-10px">सुबह 3 बजे</div></div>`,
 london:`<div class="chip" style="top:640px;text-align:center;animation:cfade .8s ease-out both">
   <div class="shadow" style="font-weight:800;font-size:90px;color:#eee">लंदन</div>
   <div class="teko shadow" style="font-size:380px;line-height:.85;background:linear-gradient(180deg,#f6d6a8,#c47a3a 55%,#7a4316);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 10px 25px rgba(0,0,0,.6))">2012</div>
   <div style="display:inline-block;margin-top:10px;font-weight:800;font-size:74px;padding:10px 46px;border-radius:50px;background:linear-gradient(90deg,#8a4b1c,#cd7f32,#8a4b1c);animation:rise .6s .6s ease-out both">ब्रॉन्ज़ मेडल</div></div>`,
 rankdown:`RANK:down`, rankup:`RANK:up`,
 vs:`<div class="chip" style="top:620px;display:flex;align-items:center;gap:60px;animation:cpop .5s cubic-bezier(.2,1.5,.4,1) both">
   <div class="shadow" style="font-weight:800;font-size:110px">भारत</div>
   <div class="teko" style="font-size:200px;color:#FFD447;line-height:1;animation:pulse .8s ease-in-out infinite alternate">VS</div>
   <div class="shadow" style="font-weight:800;font-size:110px">स्पेन</div></div>`,
 mp:`<div class="chip" style="top:700px;text-align:center;animation:cslam .5s cubic-bezier(.2,1.4,.4,1) both">
   <div class="shadow" style="font-weight:800;font-size:200px;color:#fff;-webkit-text-stroke:6px #E53935;paint-order:stroke fill;animation:pulse .5s ease-in-out infinite alternate">मैच पॉइंट</div></div>`,
 gold:`<div class="chip" style="top:600px;text-align:center;animation:cfade .8s ease-out both">
   <div class="rz" style="font-size:230px;line-height:1.05;background:linear-gradient(180deg,#fff6c2,#f5c542 50%,#a8760a);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))">गोल्ड मेडल</div>
   <div style="display:flex;justify-content:center;margin-top:10px;animation:rise .6s .5s ease-out both"><div style="width:420px;height:22px;background:#FF9933"></div></div>
   <div style="display:flex;justify-content:center"><div style="width:420px;height:22px;background:#fff"></div></div>
   <div style="display:flex;justify-content:center"><div style="width:420px;height:22px;background:#138808"></div></div></div>`,
 end:`<div style="position:absolute;left:0;top:0;width:2160px;height:3840px;display:flex;flex-direction:column;align-items:center;justify-content:center">
   <div class="rz" style="font-size:560px;line-height:1;color:#FFD447;animation:popi .6s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 0 80px rgba(255,212,71,.45)">?</div>
   <div class="shadow" style="font-weight:800;font-size:150px;line-height:1.2;text-align:center;animation:rise .6s .25s ease-out both">ये लड़की<br>कौन है?</div>
   <div style="margin-top:80px;font-weight:800;font-size:76px;padding:22px 60px;border-radius:80px;background:#E53935;animation:rise .6s 1.1s ease-out both,pulse .7s 1.7s ease-in-out infinite alternate">कमेंट करके ज़रूर बताएँ ↓</div></div>`
};
function rankSVG(dir){
  const up=dir=='up', col=up?'#43D17A':'#FF4D4D';
  const pts=up?[[0,520],[150,500],[300,430],[450,380],[600,260],[750,190],[900,90]]:[[0,90],[150,120],[300,200],[450,260],[600,380],[750,430],[900,520]];
  const d='M'+pts.map(p=>p.join(',')).join(' L');
  return `<div class="chip" style="top:520px;width:1200px;padding:50px 60px 60px;border-radius:50px;background:rgba(10,12,18,.72);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:cfade .5s ease-out both">
   <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:800;font-size:80px">वर्ल्ड रैंकिंग</div>
   <div style="font-size:120px;font-weight:800;color:${col};animation:popi .5s 1.6s cubic-bezier(.2,1.6,.4,1) both">${up?'↑':'↓'}</div></div>
   <svg width="1080" height="600" viewBox="-40 40 980 540" style="margin-top:20px">
   ${[100,200,300,400,500].map(y=>`<line x1="0" x2="900" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.12)" stroke-width="3"/>`).join('')}
   <path d="${d}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" style="stroke-dashoffset:1;animation:draw 1.8s .2s ease-in-out forwards;filter:drop-shadow(0 0 14px ${col})"/>
   </svg></div>`;
}
function setTitle(name){
  document.getElementById('cap').innerHTML='';
  const v=T[name]; document.getElementById('title').innerHTML = v.startsWith('RANK:')?rankSVG(v.slice(5)):v;
  document.getAnimations().forEach(a=>a.pause());
}
function seek(ms){document.getAnimations().forEach(a=>{a.currentTime=ms})}
</script>
<style>
@keyframes cfade{from{opacity:0;transform:translate(-50%,60px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes popi{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes cpop{from{opacity:0;transform:translateX(-50%) scale(.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes cslam{from{opacity:0;transform:translateX(-50%) scale(2.2)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
</body></html>
