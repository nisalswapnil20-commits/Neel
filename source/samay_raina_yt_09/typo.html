<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Tiro;src:url(fonts/TiroDevanagariHindi-Regular.ttf)}
@font-face{font-family:Martel;font-weight:800;src:url(fonts/Martel-ExtraBold.ttf)}
@font-face{font-family:Elite;src:url(fonts/SpecialElite-Regular.ttf)}
@font-face{font-family:Courier;font-weight:700;src:url(fonts/CourierPrime-Bold.ttf)}
html,body{margin:0;background:transparent}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,C=document.getElementById('c'),X=C.getContext('2d');
const AMBER='#FFC247',PAPER='#F6EFE2',INK='#FFFFFF';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lin=(t,a,b)=>cl((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const R=s=>{let x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const SEG=new Intl.Segmenter('hi',{granularity:'grapheme'});
const graph=s=>[...SEG.segment(s)].map(g=>g.segment);
const END=26.2, OUT=24.86;

// ---- caption groups: words with start times (from transcription). *word* = highlight
// y: centre of text block; size: font px; end: when the group leaves
const GROUPS=[
 {y:1500,size:100,end:2.16,words:[['तो',0.00],['बस',0.52],['*पापा',0.68],['ही',1.10],['थे',1.26],['उस',1.40],['टाइम',1.56],['पे',1.78],['यार',2.00]]},
 {y:1060,size:118,end:4.62,words:[['तो',2.18],['I',3.34],['told',3.42],['him',3.76],['\n',3.9],['*everything',3.94]]},
 {y:1060,size:104,end:6.74,words:[['I',4.68],['spoke',4.76],['to',5.08],['him',5.34],['for',5.50],['\n',5.6],['*one and a half',5.68],['hours',6.36]]},
 {y:1040,size:100,end:9.14,words:[['and',6.78],['I',6.98],['told',7.10],['him',7.32],['\n',7.4],['*पापा',7.48],['ऐसा',7.76],['हो',8.04],['गया',8.24],['है,',8.44],['\n',8.5],['ऐसा',8.54],['हो',8.76],['गया',8.94],['है…',9.08]]},
 {y:1060,size:106,end:11.38,words:[['and',9.18],['my',9.28],['dad',9.38],['was',9.70],['\n',9.8],['such',9.92],['a',10.18],['*ROCK',10.32],['\n',10.5],['in',10.60],['that',10.80],['moment',10.94]]},
 {y:1060,size:112,end:12.78,words:[['he',11.40],['said',11.62],['\n',11.8],['*रो',11.86],['क्यों',12.04],['रहा',12.28],['है',12.46],['यार',12.56]]},
 {y:1060,size:118,end:14.26,words:[['शो',12.82],['ही',13.40],['तो',13.58],['*बंद',13.72],['हुआ',13.90],['है',14.00]]},
 {y:1060,size:112,end:17.05,words:[['the',14.30],['show',15.06],['exists',15.40],['\n',15.6],['because',15.82],['of',16.24],['*YOU',16.58]]},
 {y:1060,size:106,end:20.20,ding:true,words:[['you',17.12],['*don\'t',18.08],['exist',18.66],['\n',18.9],['because',19.02],['of',19.36],['the',19.62],['show.',19.76]]},
 {y:1480,size:110,end:22.60,words:[['ऐसे',20.50],['*पापा',20.80],['सबको',21.10],['मिलें।',21.40]]},
];

// build per-grapheme typing schedule + layout
const EV=[]; // sound events
function build(){
 for(const g of GROUPS){
  X.font=`${g.size}px Tiro`;
  const sp=X.measureText(' ').width;
  const lines=[[]]; let lw=0;
  g.words.forEach(([raw,t],i)=>{
   if(raw==='\n'){lines.push([]);lw=0;return}
   const hl=raw.startsWith('*'), txt=hl?raw.slice(1):raw;
   const w=X.measureText(txt).width;
   if(lines.at(-1).length && lw+sp+w>940){lines.push([]);lw=0}
   const nxt=(g.words.slice(i+1).find(v=>v[0]!=='\n')||[0,g.end-0.15])[1];
   const gs=graph(txt), dur=Math.min(nxt-t-0.02, 0.055*gs.length, 0.42);
   const per=Math.max(dur,0.03*gs.length)/gs.length;
   const word={txt,hl,w,gs,times:gs.map((_,k)=>t+k*per)};
   word.done=word.times.at(-1)+per;
   lines.at(-1).push(word); lw+=(lines.at(-1).length>1?sp:0)+w;
   word.times.forEach((tt,k)=>{ if(gs[k].trim()&&gs[k]!=='…') EV.push({t:tt,k:'key'}) });
  });
  g.lines=lines.filter(l=>l.length); g.sp=sp;
  g.start=g.words[0][1]; g.last=Math.max(...g.lines.flat().map(w=>w.done));
  const lh=g.size*1.42;
  g.lines.forEach((l,li)=>{
   const tot=l.reduce((a,w)=>a+w.w,0)+sp*(l.length-1); let x=(W-tot)/2;
   const y=g.y+(li-(g.lines.length-1)/2)*lh;
   l.forEach(w=>{w.x=x;w.y=y;x+=w.w+sp});
  });
  if(g.ding) EV.push({t:g.last+0.04,k:'ding'});
  EV.push({t:g.start-0.02,k:'cut'});
 }
}

function drawGroup(g,t){
 if(t<g.start-0.05||t>g.end+0.25) return;
 const out=lin(t,g.end-0.10,g.end+0.12); if(out>=1) return;
 X.save();
 X.globalAlpha=1-out; X.translate(0,-30*eOut(out));
 // legibility band
 const top=g.lines[0][0].y-g.size*1.1, bot=g.lines.at(-1)[0].y+g.size*1.0;
 const band=X.createLinearGradient(0,top-140,0,bot+140);
 const a=0.55*lin(t,g.start-0.05,g.start+0.25);
 band.addColorStop(0,'rgba(0,0,0,0)');band.addColorStop(0.3,`rgba(0,0,0,${a})`);
 band.addColorStop(0.7,`rgba(0,0,0,${a})`);band.addColorStop(1,'rgba(0,0,0,0)');
 X.fillStyle=band;X.fillRect(0,top-140,W,bot-top+280);
 X.font=`${g.size}px Tiro`; X.textBaseline='alphabetic'; X.textAlign='left';
 let cur=null;
 for(const l of g.lines) for(const w of l){
  const n=w.times.filter(tt=>tt<=t).length; if(!n) continue;
  const s=w.gs.slice(0,n).join('');
  const base=w.y+g.size*0.34;
  // highlighter sweep behind key words once typed
  if(w.hl){
   const sw=eOut(lin(t,w.done,w.done+0.22));
   if(sw>0){X.fillStyle='rgba(255,194,71,0.92)';
    X.fillRect(w.x-10,w.y-g.size*0.50,(w.w+20)*sw,g.size*1.02);}
  }
  const ink=w.hl&&lin(t,w.done,w.done+0.22)>0.5?'#141008':(w.hl?AMBER:INK);
  // newest glyph: strike-in (slight drop + ink flash)
  const tl=w.times[n-1], k=lin(t,tl,tl+0.09);
  X.save();
  X.shadowColor='rgba(0,0,0,0.75)';X.shadowBlur=w.hl&&ink!==AMBER?0:18;X.shadowOffsetY=4;
  X.fillStyle=ink;
  // jitter per word like a real typewriter (deterministic)
  const jy=(R(w.x)-0.5)*5;
  if(n>1){X.fillText(w.gs.slice(0,n-1).join(''),w.x,base+jy)}
  const pre=X.measureText(w.gs.slice(0,n-1).join('')).width;
  X.globalAlpha*=0.35+0.65*k;
  X.fillText(s,w.x,base+jy-(1-k)*10); // full prefix redraw keeps Devanagari shaping
  X.restore();
  cur={x:w.x+X.measureText(s).width+8,y:w.y,h:g.size,t:tl};
 }
 // cursor
 if(cur&&out===0){
  const idle=t-cur.t, on=idle<0.25||Math.floor(idle/0.42)%2===0;
  if(on){X.fillStyle=AMBER;X.fillRect(cur.x,cur.y-cur.h*0.46,cur.h*0.09,cur.h*0.92)}
 }
 X.restore();
}

function header(t){
 // top label typed once, then stays
 const lab='SAMAY RAINA', a=lin(t,0.15,0.6);
 X.save();X.globalAlpha=a*(1-lin(t,OUT,OUT+0.3));
 X.font='44px Elite';X.textAlign='center';X.fillStyle=PAPER;X.letterSpacing='10px';
 const n=Math.floor(cl((t-0.15)/0.05,0,lab.length));
 X.shadowColor='rgba(0,0,0,0.7)';X.shadowBlur=14;
 X.fillText(lab.slice(0,n),W/2,178);
 X.font='30px Courier';X.letterSpacing='6px';X.fillStyle=AMBER;
 X.fillText('— STAND-UP —',W/2,232);
 X.restore();
 // progress bar
 X.fillStyle='rgba(255,255,255,0.18)';X.fillRect(90,1792,900,5);
 X.fillStyle=AMBER;X.fillRect(90,1792,900*cl(t/END),5);
}

function outro(t){
 if(t<OUT) return;
 const a=lin(t,OUT,OUT+0.4);
 X.save();
 X.fillStyle=`rgba(8,7,6,${0.78*a})`;X.fillRect(0,0,W,H);
 const lab='SAMAY RAINA'; const n=Math.floor(cl((t-(OUT+0.2))/0.045,0,lab.length));
 X.font='96px Elite';X.textAlign='center';X.fillStyle=PAPER;X.letterSpacing='6px';
 X.fillText(lab.slice(0,n),W/2,930);
 const w=X.measureText(lab.slice(0,n)).width;
 if(n<lab.length||Math.floor(t/0.4)%2===0){X.fillStyle=AMBER;X.fillRect(W/2+w/2+10,858,10,86)}
 const b=lin(t,OUT+0.75,OUT+1.05);
 X.globalAlpha=b;X.font='800 58px Martel';X.letterSpacing='0px';X.fillStyle=AMBER;
 X.fillText('पापा हैं, तो सब है।',W/2,1070+20*(1-eOut(b)));
 X.restore();
 if(t>24.1&&EV.every(e=>e.k!=='ding2')) {}
}

function render(t){
 X.clearRect(0,0,W,H);
 // subtle top/bottom gradient so header & bar read on any footage
 let g=X.createLinearGradient(0,0,0,360);g.addColorStop(0,'rgba(0,0,0,0.55)');g.addColorStop(1,'rgba(0,0,0,0)');
 X.fillStyle=g;X.fillRect(0,0,W,360);
 g=X.createLinearGradient(0,H-300,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');
 X.fillStyle=g;X.fillRect(0,H-300,W,300);
 for(const gr of GROUPS) drawGroup(gr,t);
 header(t); outro(t);
}
window.ready=document.fonts.load('104px Tiro').then(()=>Promise.all([
 document.fonts.load('44px Elite'),document.fonts.load('30px Courier'),document.fonts.load('800 58px Martel')]))
 .then(()=>{build();
  // outro typing sounds
  for(let i=0;i<11;i++) if(i!==5) EV.push({t:OUT+0.2+i*0.045,k:'key'});
  EV.push({t:OUT+0.75,k:'ding'});
  EV.sort((a,b)=>a.t-b.t); window.EVENTS=EV;});
</script></body></html>
